<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-POP 여자 연예인 분류기</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  #face-image { max-width: 100%; max-height: 360px; display: block; margin: 12px 0; border-radius: 8px; }
  #result-title { font-size: 1.6rem; font-weight: 700; margin: 12px 0 4px; }
  #result-explain { color: #555; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar > span:first-child { width: 5em; }
  .bar > div { height: 14px; background: #1f5fd6; border-radius: 7px; }
</style></head>
<body>
<h1>K-POP 여자 연예인 분류기</h1>
<p>사진을 고르면 누구인지 맞춰 봅니다.</p>
<input type="file" id="file" accept="image/*">
<img id="face-image" alt="" hidden>
<div id="result-title"></div>
<div id="result-explain"></div>
<div id="bars"></div>

<!-- Teachable Machine 이미지 모델 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // ① 모델 폴더: model.json, metadata.json, weights.bin 이 들어 있는 폴더 (이 파일 기준 상대 경로)
  const MODEL_URL = "./mltest_files/";

  // ② 클래스 설명: Teachable Machine 에서 정한 클래스 이름을 그대로 쓰고, 설명만 바꾸면 된다.
  const dic_class2information = {
    "안유진": "스타쉽엔터테인먼트 소속 걸그룹 IVE의 멤버.",
    "최예나": "가수이자 배우로 활동하는 솔로 아티스트.",
    "로제": "YG엔터테인먼트 소속 걸그룹 BLACKPINK의 멤버."
  };

  let model;
  const img = document.getElementById("face-image");

  async function loadModel() {
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  }

  async function predict() {
    const prediction = await model.predict(img, false);
    prediction.sort((a, b) => b.probability - a.probability);
    const top = prediction[0];
    document.getElementById("result-title").textContent =
      top.className + " (" + (top.probability * 100).toFixed(0) + "%)";
    document.getElementById("result-explain").textContent =
      dic_class2information[top.className] || "설명 없음";
    document.getElementById("bars").innerHTML = prediction.map(p =>
      `<div class="bar"><span>${p.className}</span><div style="width:${(p.probability * 100).toFixed(0)}%"></div>` +
      `<span>${(p.probability * 100).toFixed(0)}%</span></div>`).join("");
  }

  document.getElementById("file").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!model) await loadModel();
    img.onload = predict;
    img.src = URL.createObjectURL(f);
    img.hidden = false;
  });
</script>
</body></html>
